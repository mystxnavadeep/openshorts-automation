# Nginx configuration for OpenShorts Dashboard
# Binds STRICTLY to your private Tailscale IP (100.x.y.z)
# Never binds to 0.0.0.0 or public interface

server {
    # Replace 100.85.12.34 with your actual Tailscale IP (run 'tailscale ip -4')
    listen 100.85.12.34:80;
    server_name openshorts.internal;

    # Client limits
    client_max_body_size 50M;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Reverse proxy to backend uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
