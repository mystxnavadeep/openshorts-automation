name: Official OpenShorts Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL to process'
        required: true
        type: string
      output_format:
        description: 'Output Aspect Ratio'
        required: false
        default: 'vertical'
        type: choice
        options:
          - vertical
          - square
          - horizontal
          - auto
      gemini_model:
        description: 'Google Gemini Model for Moment Selection'
        required: false
        default: 'gemini-2.5-flash'
        type: choice
        options:
          - gemini-2.5-flash
          - gemini-1.5-flash
          - gemini-3.1-flash-lite
          - gemini-2.0-flash
      whisper_model:
        description: 'Faster-Whisper Model (CPU int8)'
        required: false
        default: 'base'
        type: choice
        options:
          - base
          - small
          - tiny
      auto_hook:
        description: 'Generate AI viral hook overlay text'
        required: false
        default: true
        type: boolean
      workers:
        description: 'Concurrent clip workers (1 recommended on CPU runner)'
        required: false
        default: '1'
        type: string
      gdrive_folder:
        description: 'Google Drive destination folder name'
        required: false
        default: 'OpenShorts'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  process-video:
    name: Official OpenShorts Execution
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout Repository (with OpenShorts Engine)
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies & rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libass-dev \
            fonts-liberation \
            fonts-noto-core \
            rclone

      - name: 🔑 Configure rclone Google Drive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          if [ -n "$RCLONE_CONFIG_DATA" ]; then
            echo "Setting up rclone configuration from secrets..."
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
            echo "Testing rclone remote connection..."
            rclone listremotes
            if rclone listremotes | grep -q "gdrive:"; then
              echo "✓ Remote 'gdrive:' detected and ready!"
            else
              echo "⚠️ Warning: 'gdrive:' remote not found in rclone.conf. Listing remotes:"
              rclone listremotes
            fi
          else
            echo "⚠️ RCLONE_CONFIG_DATA secret is not set. Google Drive upload step will be skipped."
          fi

      - name: ⚡ Install Official OpenShorts Dependencies
        run: |
          python -m pip install --upgrade pip
          # 1. Install CPU PyTorch build to avoid downloading 3+ GB of CUDA packages on CPU runner
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision
          # 2. Install official OpenShorts dependencies from engine/requirements.txt
          pip install -r engine/requirements.txt
          # 3. Pre-cache YOLOv8n weights
          python3 -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: 🎬 Run Official OpenShorts Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES || secrets.YT_COOKIES }}
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES || secrets.YT_COOKIES }}
          GPU_RENDER: "0"
          FORCE_CPU: "1"
          TRANSCRIBE_BACKEND: "whisper"
          WHISPER_DEVICE: "cpu"
          WHISPER_COMPUTE: "int8"
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          CLIP_WORKERS: ${{ inputs.workers }}
          AUTO_HOOK: ${{ inputs.auto_hook && '1' || '0' }}
          WATERMARK: "0"
        run: |
          echo "=========================================================="
          echo "Executing Official OpenShorts (mutonby/openshorts)..."
          echo "URL: ${{ inputs.youtube_url }}"
          echo "Format: ${{ inputs.output_format }}"
          echo "Gemini Model: ${{ inputs.gemini_model }}"
          echo "Whisper Model: ${{ inputs.whisper_model }}"
          echo "=========================================================="

          python3 pipeline/run_openshorts.py \
            --url "${{ inputs.youtube_url }}" \
            --output-dir "output" \
            --format "${{ inputs.output_format }}" \
            --gemini-model "${{ inputs.gemini_model }}" \
            --whisper-model "${{ inputs.whisper_model }}" \
            --auto-hook "${{ inputs.auto_hook }}" \
            --workers "${{ inputs.workers }}"

      - name: 📦 Upload Generated Shorts as Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openshorts-run-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: ☁️ Upload Shorts to Google Drive via rclone
        if: success()
        run: |
          if [ -f ~/.config/rclone/rclone.conf ] && rclone listremotes | grep -q "gdrive:"; then
            TARGET_PATH="gdrive:${{ inputs.gdrive_folder }}/Run-${{ github.run_number }}"
            echo "📤 Uploading official OpenShorts clips to Google Drive ($TARGET_PATH)..."
            rclone copy output/ "$TARGET_PATH" \
              --progress \
              --transfers 4 \
              --checkers 8 \
              --drive-chunk-size 32M
            echo "✅ Successfully synced output to Google Drive: $TARGET_PATH"
          else
            echo "ℹ️ Skipping Google Drive upload: rclone config not present or 'gdrive:' remote not found."
          fi

      - name: 📊 Generate Workflow Summary
        if: always()
        run: |
          echo "### ⚡ Official OpenShorts Execution Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Video**: ${{ inputs.youtube_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: ${{ inputs.output_format }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Engine**: [mutonby/openshorts](https://github.com/mutonby/openshorts)" >> $GITHUB_STEP_SUMMARY
          echo "- **Google Drive Destination**: \`gdrive:${{ inputs.gdrive_folder }}/Run-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d output ]; then
            echo "#### 🎬 Generated Output Files:" >> $GITHUB_STEP_SUMMARY
            echo "| File | Size (MB) |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            for f in output/*; do
              if [ -f "$f" ]; then
                fname=$(basename "$f")
                fsize=$(du -m "$f" | cut -f1)
                echo "| \`$fname\` | ${fsize} MB |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
